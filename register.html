<!DOCTYPE html>
<html>
<head>
<title>Student Registration</title>
</head>

<body>

<h2>Course Registration</h2>

<form id="registerForm">

Name<br>
<input type="text" id="name" required><br><br>

Phone Number<br>
<input type="text" id="phone" required><br><br>

Email<br>
<input type="email" id="email"><br><br>

Date of Birth<br>
<input type="date" id="dob"><br><br>

Course Interested<br>
<input type="text" id="course"><br><br>

Address<br>
<textarea id="address"></textarea><br><br>

Profile Type<br>
<select id="profileType">
<option value="Student">Student</option>
<option value="Employee">Employee</option>
</select><br><br>

Company Name<br>
<input type="text" id="companyName"><br><br>

Domain<br>
<input type="text" id="domain"><br><br>

Experience in Present Company<br>
<input type="text" id="presentExp"><br><br>

<button type="submit">Register</button>

</form>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbyPa-sbYKuOf6m9-DrqUTnNRxYB_47CgdUBSepIBYZC03HzjP_kUjVKbs1fXt77z1R4/exec";

document.getElementById("registerForm").addEventListener("submit", function(e){

e.preventDefault();

const data = {
name: document.getElementById("name").value,
phone: document.getElementById("phone").value,
email: document.getElementById("email").value,
dob: document.getElementById("dob").value,
course: document.getElementById("course").value,
address: document.getElementById("address").value,
profileType: document.getElementById("profileType").value,
companyName: document.getElementById("companyName").value,
domain: document.getElementById("domain").value,
presentExp: document.getElementById("presentExp").value
};

fetch(scriptURL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(data=>{
alert("Registration Successful");
document.getElementById("registerForm").reset();
})
.catch(err=>{
alert("Error submitting form");
});

});

</script>

</body>
</html>
