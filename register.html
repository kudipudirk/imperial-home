<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPa-sbYKuOf6m9-DrqUTnNRxYB_47CgdUBSepIBYZC03HzjP_kUjVKbs1fXt77z1R4/exec";

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

document.getElementById('regForm').addEventListener('submit', async function(e) {

  e.preventDefault();

  const name    = document.getElementById('name').value.trim();
  const phone   = document.getElementById('phone').value.trim();
  const dob     = document.getElementById('dob').value;
  const email   = document.getElementById('email').value.trim();
  const course  = document.getElementById('course').value;
  const address = document.getElementById('address').value.trim();

  if (!name || !phone || !dob || !email || !course || !address) {
    showToast('⚠️ Please fill in all required fields.', true);
    return;
  }

  if (!/^[6-9]\d{9}$/.test(phone)) {
    showToast('⚠️ Enter a valid 10-digit phone number.', true);
    return;
  }

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showToast('⚠️ Enter a valid email address.', true);
    return;
  }

  const btn     = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  const spinner = document.getElementById('spinner');

  btn.disabled = true;
  btnText.textContent = 'Submitting...';
  spinner.style.display = 'block';

  try {

    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        phone,
        email,
        dob,
        course,
        address
      })
    });

    const result = await response.json();

    if(result.status === "success"){
      showToast("✅ Registration successful! We will contact you soon.");
      document.getElementById("regForm").reset();
    }else{
      showToast("❌ Error submitting form.", true);
    }

  } catch (error) {
    showToast("❌ Network error. Please try again.", true);
  }

  btn.disabled = false;
  btnText.textContent = "Submit Registration";
  spinner.style.display = "none";

});
</script>
