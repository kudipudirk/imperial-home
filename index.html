
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Tech Academy</title>
  <style>
    body {font-family: Arial, sans-serif; margin:0; background:#f5f5f5;}
    header {background:#0b3d91; color:white; padding:20px; text-align:center;}
    .container {max-width:900px; margin:auto; background:white; padding:20px;}
    h1 {margin:0;}
    form {display:grid; gap:10px;}
    input, select, textarea {padding:10px; font-size:14px; width:100%;}
    button {padding:12px; background:#0b3d91; color:white; border:none; cursor:pointer;}
    button:hover {background:#072a63;}
    footer {text-align:center; padding:15px; font-size:12px; color:#555;}
  </style>
</head>
<body>

<header>
  <h1>Imperial Tech Academy</h1>
  <p>Cloud | DevOps | Linux | Terraform Training</p>
</header>

<div class="container">

<h2>Student Enrollment Form</h2>

<form id="enrollForm">
  <input type="text" name="name" placeholder="Full Name" required>
  <input type="tel" name="phone" placeholder="Phone Number" required>
  <input type="email" name="email" placeholder="Email Address" required>

  <select name="course" required>
    <option value="">Select Course</option>
    <option>DevOps</option>
    <option>AWS Cloud</option>
    <option>Linux Administration</option>
    <option>Terraform</option>
  </select>

  <select name="batch">
    <option value="">Preferred Batch</option>
    <option>Morning</option>
    <option>Evening</option>
    <option>Weekend</option>
  </select>

  <textarea name="message" placeholder="Message"></textarea>

  <button type="submit">Submit Enrollment</button>
</form>

<p id="status"></p>

</div>

<footer>
  © 2026 Imperial Tech Academy
</footer>

<script>
const form = document.getElementById("enrollForm");
const status = document.getElementById("status");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const data = Object.fromEntries(new FormData(form).entries());

  fetch("https://formspree.io/f/xbdpapbk", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify(data)
  })
  .then(response => {
    if(response.ok){
      status.innerText = "Enrollment submitted successfully!";
      form.reset();
    } else {
      status.innerText = "Error submitting form.";
    }
  })
  .catch(() => status.innerText = "Network error.");
});
</script>

</body>
</html>
